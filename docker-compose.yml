# CrypTX — production docker-compose
#
# Quick start:
#   1. Copy .env.example to .env and fill in secrets (AUTH_SECRET is REQUIRED).
#   2. docker compose up -d --build
#   3. Open http://localhost (nginx serves frontend + proxies /api to backend)
#
# The SQLite DB persists in the cryptx_data volume. For multi-worker consistency
# with the in-process API-key rate limiter, the backend runs a single worker by
# default; set BACKEND_WORKERS=4 in .env to scale (rate limiting becomes per-worker
# until the Redis counter lands in Phase 2).

services:
  cryptx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptx-backend
    env_file: .env
    environment:
      # DB persists in the mounted volume.
      - DB_PATH=/app/backend/data/cryptoosint.db
    volumes:
      - cryptx_data:/app/backend/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: cryptx-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro  # serve pre-built frontend
    depends_on:
      cryptx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cryptx_data:

