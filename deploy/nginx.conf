# CrypTX nginx reverse-proxy config
# Serves the built frontend (Vite static assets) and proxies /api + /health to
# the FastAPI backend container.

upstream cryptx_backend {
    server cryptx:8000;
    keepalive 32;
}

# ── Rate limiting zone (API endpoints) ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ── Request size limit (reduced from 50m to prevent abuse) ──────────────
    client_max_body_size 10m;

    # ── Hide nginx version ──────────────────────────────────────────────────
    server_tokens off;

    # ── Block access to hidden files ────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Auth endpoints: stricter rate limiting ──────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://cryptx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API + health → backend ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://cryptx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;  # long-running traces/scrapes
        proxy_send_timeout 360s;
    }

    location /health {
        proxy_pass http://cryptx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Block Swagger/OpenAPI in production ─────────────────────────────────
    location /docs {
        return 404;
    }
    location /redoc {
        return 404;
    }
    location /openapi.json {
        return 404;
    }

    # ── Static frontend (Vite build output) ─────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # SPA fallback

        # Security headers for HTML pages
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Cache hashed assets aggressively
        location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}
